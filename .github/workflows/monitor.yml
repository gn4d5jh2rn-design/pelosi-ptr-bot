name: Pelosi PTR Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-filings:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4

      - name: Check Pelosi PTR filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save new filing state
        run: |
          if git diff --quiet seen_filings.json; then
            echo "No change to filing state."
          else
            git config user.name "Pelosi PTR Bot"
            git config user.email "actions@github.com"
            git add seen_filings.json
            git commit -m "Update seen Pelosi PTR filings"
            git push
          fi
